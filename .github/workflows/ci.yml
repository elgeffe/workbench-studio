name: CI

# Every pull request, and every push to main so a merge is checked too.
# deploy.yml only builds on a push to main — by then a regression is already on
# the default branch, and its e2e suite never ran at all.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# A branch that gets a second push doesn't need the first push's answer.
# Cancelling the superseded run keeps the queue short and the feedback quick.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Types, unit tests and a production build. Split from the browser suite so a
  # red check says which half broke without opening the log, and so the fast
  # half isn't queued behind a browser download.
  verify:
    name: types · unit tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      # The build is a test in its own right: svelte-check reads the types, but
      # only a real build catches what breaks when Vite bundles it.
      - name: Build
        run: npm run build

  e2e:
    name: browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only the browser the suite actually uses — playwright.config.ts declares
      # a single chromium project, and the other two engines are a slow download
      # nothing here would launch. --with-deps adds the system libraries the
      # runner image doesn't carry.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Playwright starts the dev server itself (webServer in the config), so
      # there is nothing to serve here.
      - name: Run the suite
        run: npx playwright test

      # The HTML report carries the trace of a failed test — the retry writes
      # one — which is most of the debugging for a browser failure you cannot
      # reproduce locally.
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
